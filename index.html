<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIWES Report Builder</title>
    <script src="index.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; font-size: 22px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { margin-top: 20px; width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background: #218838; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>SIWES Report Builder</h1>
    <p style="text-align:center; font-size:14px; color:#666;">Fill this form to generate your formatted Word document.</p>

    <label>Full Name:</label>
    <input type="text" id="fullName" placeholder="e.g., John Doe">

    <label>Matric Number:</label>
    <input type="text" id="matricNo" placeholder="e.g., FSC/CSC/12345678">

    <label>Name of Organization (Company):</label>
    <input type="text" id="companyName" placeholder="e.g., Tech Solutions Ltd">

    <label>Start Date (Month, Year):</label>
    <input type="text" id="startDate" placeholder="e.g., June, 2025">

    <label>End Date (Month, Year):</label>
    <input type="text" id="endDate" placeholder="e.g., December, 2025">

    <label>HOD's Name:</label>
    <input type="text" id="hodName" placeholder="e.g., Dr. A. B. Smith">

    <label>Industrial Supervisor's Name:</label>
    <input type="text" id="supName" placeholder="e.g., Mr. J. Doe">

    <label>Paste your Logbook Entries (Raw notes):</label>
    <textarea id="logbook" rows="5" placeholder="e.g., Week 1: Orientation, setup of workstation. Week 2: Learned networking basics..."></textarea>

    <button onclick="generateDoc()">Generate Word Document</button>
    <div id="status"></div>
</div>

<script>
    async function generateDoc() {
        const status = document.getElementById('status');
        status.innerText = "Generating... Please wait.";

        if (typeof docx === 'undefined') {
            status.innerText = "Error: Word library not loaded. Ensure index.js is in your repository.";
            status.style.color = "red";
            return;
        }

        const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;

        const name = document.getElementById('fullName').value || "[Your Name]";
        const matric = document.getElementById('matricNo').value || "[Matric No]";
        const company = document.getElementById('companyName').value || "[Company Name]";
        const start = document.getElementById('startDate').value || "[Start Date]";
        const end = document.getElementById('endDate').value || "[End Date]";
        const hod = document.getElementById('hodName').value || "[HOD's Name]";
        const sup = document.getElementById('supName').value || "[Supervisor's Name]";
        
        // If they leave logbook empty, we put a placeholder
        const rawLogbook = document.getElementById('logbook').value || "Week 1: Orientation. Week 2: Training began.";
        
        // This formats the logbook into paragraphs instead of one big block of text
        const logbookParagraphs = rawLogbook.split('\n').map(line => {
            return new Paragraph({
                alignment: AlignmentType.JUSTIFIED,
                spacing: { line: 480, lineRule: "auto" },
                children: [new TextRun({ text: line, font: "Times New Roman", size: 24 })]
            });
        });

        const formatText = (text, bold = false) => {
            return new Paragraph({
                alignment: AlignmentType.JUSTIFIED,
                spacing: { line: 480, lineRule: "auto" },
                children: [new TextRun({ text: text, font: "Times New Roman", size: 24, bold: bold })]
            });
        };

        const helperText = (text) => {
            return new Paragraph({
                alignment: AlignmentType.JUSTIFIED,
                spacing: { line: 480, lineRule: "auto" },
                children: [new TextRun({ text: text, font: "Times New Roman", size: 24, italics: true, color: "FF0000" })]
            });
        };

        const formatHeading = (text) => {
            return new Paragraph({
                alignment: AlignmentType.LEFT,
                spacing: { before: 240, after: 120 },
                children: [new TextRun({ text: text, font: "Times New Roman", size: 28, bold: true })]
            });
        };

        const doc = new Document({
            sections: [{
                properties: {},
                children: [
                    // Cover Page
                    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 2000 }, children: [new TextRun({ text: "A TECHNICAL REPORT ON", font: "Times New Roman", size: 28, bold: true })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 400 }, children: [new TextRun({ text: "STUDENTS' INDUSTRIAL WORK EXPERIENCE SCHEME (SIWES)", font: "Times New Roman", size: 28, bold: true })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "UNDERTAKEN AT", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 400 }, children: [new TextRun({ text: company.toUpperCase(), font: "Times New Roman", size: 28, bold: true })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "BY", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: name.toUpperCase(), font: "Times New Roman", size: 28, bold: true })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 400 }, children: [new TextRun({ text: matric, font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "DEPARTMENT OF COMPUTER SCIENCE", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "FACULTY OF SCIENCE", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 400 }, children: [new TextRun({ text: "EDO STATE UNIVERSITY IYAMHO", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "SUBMITTED IN PARTIAL FULFILMENT OF THE AWARD OF", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "BACHELOR OF SCIENCE (B.Sc.) IN COMPUTER SCIENCE", font: "Times New Roman", size: 24 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 400 }, children: [new TextRun({ text: `${start.toUpperCase()} TO ${end.toUpperCase()}`, font: "Times New Roman", size: 24 })] }),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("DECLARATION"),
                    formatText(`I, ${name}, a student of Computer Science Department, Edo State University Iyamho, hereby declare that this technical report on the Students' Industrial Work Experience Scheme (SIWES) is an accurate account of the activities and experiences during my industrial training period at ${company}, from ${start} to ${end}. This report is my original work, written in partial fulfillment of the requirements for the award of Bachelor of Science in Computer Science. I affirm that all information and data contained herein are true and correct to the best of my knowledge. I also declare that this report has not been submitted elsewhere for any purpose.`),
                    
                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("DEDICATION"),
                    formatText(`I dedicate this report to God Almighty for His grace, strength, and wisdom, as well as to my parents and guardians for their unwavering support and encouragement throughout my academic journey and during my SIWES program. I also dedicate this work to my supervisors and mentors at ${company}, whose guidance and expertise provided me with invaluable learning experiences, and finally to my friends and loved ones for their continuous support and motivation.`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("ACKNOWLEDGEMENT"),
                    formatText(`I would like to express my deep gratitude to God Almighty for His grace, guidance, and strength throughout my SIWES program and the successful completion of this report. My sincere appreciation goes to my parents and family for their unwavering support, encouragement, and prayers.`),
                    formatText(`I am deeply grateful to the Head of Department, ${hod}, for his/her leadership, support, and encouragement during the course of my industrial training. I also extend my sincere gratitude to the members of staff in the Department of Computer Science for their valuable guidance, assistance, and constructive feedback throughout this process.`),
                    formatText(`I am deeply thankful to ${company}, where I carried out my training, for granting me the opportunity to learn and gain practical experience. I particularly appreciate the efforts of my industrial supervisor, ${sup}, and all the staff members for their mentorship, cooperation, and assistance.`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("ABSTRACT"),
                    formatText(`This report presents a detailed account of my industrial work experience at ${company}, undertaken from ${start} to ${end}. The Students' Industrial Work Experience Scheme (SIWES) is a vital program designed to bridge the gap between theoretical classroom learning and practical industrial application. During this period, I was exposed to real-world technical environments, which allowed me to develop both hard and soft skills. The report highlights the specific activities carried out, projects executed, and the technical skills acquired in the field of computer science. It also discusses the challenges encountered during the training and the solutions implemented to overcome them. Ultimately, the training provided invaluable practical exposure, preparing me for future professional roles in the technology sector.`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("CHAPTER ONE"),
                    
                    formatHeading("1.1 Introduction to Industrial Training"),
                    formatText(`Industrial training is a mandatory component of the academic curriculum for students in various tertiary institutions. It is a structured program designed to expose students to the realities of the corporate world and the practical applications of their academic studies. The Students' Industrial Work Experience Scheme (SIWES) is the principal regulatory framework for this exercise in Nigeria. It provides a platform for students to transition from the theoretical environment of the classroom to the practical, dynamic, and often demanding environment of the industry.`),
                    formatText(`The training is essential because it allows students to develop technical competencies, understand workplace ethics, and build professional networks. By participating in this scheme, students are better prepared to face the challenges of the modern workforce upon graduation.`),
                    
                    formatHeading("1.2 Objective of Industrial Training"),
                    formatText(`The primary objective of the industrial training is to provide students with hands-on experience in their respective fields of study. This is achieved through the following specific goals:`),
                    formatText(`To apply the theoretical knowledge acquired in the university to solve practical, real-world problems in an industrial setting.`),
                    formatText(`To expose students to modern tools, equipment, and technologies that are currently used in the industry, which may not be readily available in the university laboratories.`),
                    formatText(`To develop essential soft skills, including communication, teamwork, time management, and problem-solving, which are critical for professional success.`),
                    formatText(`To provide an opportunity for students to interact with professionals in their field, thereby building networks and gaining mentorship.`),
                    
                    formatHeading("1.3 SIWES Regulatory Agencies"),
                    formatText(`The SIWES program is governed and coordinated by several key bodies. The Industrial Training Fund (ITF) is the primary agency responsible for the funding and overall administration of the scheme. The National Universities Commission (NUC) provides the policy framework and guidelines for the implementation of the program within universities. Additionally, the institution (Edo State University Iyamho) has a dedicated SIWES coordinator and departmental coordinators who oversee the placement, monitoring, and evaluation of students during their training.`),
                    
                    formatHeading("1.4 Benefits of Industrial Training to Students"),
                    formatText(`The benefits of the SIWES program to a student are multifaceted. It provides a realistic preview of the professional world, helping students to confirm their career choices. It enhances their employability by adding practical experience to their resume. The training also helps in developing a strong work ethic, discipline, and the ability to work under pressure. Furthermore, students gain confidence in their abilities and acquire specific technical skills that give them a competitive edge in the job market.`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("CHAPTER TWO"),
                    
                    formatHeading("2.1 History of Place of Attachment"),
                    helperText(`[NOTE: Add the actual history of ${company} here. When was it founded? Who founded it? What is its core business? Delete this red text when done.]`),
                    
                    formatHeading("2.2 Objectives of the Establishment"),
                    helperText(`[NOTE: Add the mission and vision of ${company} here. What are their main goals? Delete this red text when done.]`),
                    
                    formatHeading("2.3 Organogram of the Establishment"),
                    formatText(`The organizational structure of ${company} is designed to ensure efficient operation, clear lines of authority, and effective communication across all departments. The structure comprises various levels of management and operational units that work cohesively to achieve the company's objectives.`),
                    helperText(`[NOTE: Delete this red text. Insert an image of the company's organogram here in Word. Make sure to label it "Figure 2.1: Organogram of ${company}"]`),
                    
                    formatHeading("2.4 Departments/Units in the Establishment and Their Functions"),
                    helperText(`[NOTE: List the departments (e.g., HR, IT, Finance, Operations) and explain what each department does. Delete this red text when done.]`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("CHAPTER THREE"),
                    
                    formatHeading("3.1 Activities Carried Out During the Period of Attachment"),
                    formatText(`Throughout my industrial attachment at ${company}, I was actively involved in various daily operations, which provided me with a comprehensive learning experience. My activities were carefully supervised and aligned with the goals of the department I was assigned to. Below is a summary of the activities carried out based on my weekly logbook:`),
                    
                    ...logbookParagraphs, // Inserts the formatted logbook here
                    
                    helperText(`[NOTE: You can expand on the activities listed above in clear paragraphs. Explain the details of what you actually did day-to-day. Delete this red text when done.]`),
                    
                    formatHeading("3.2 Projects Executed"),
                    helperText(`[NOTE: Describe the specific projects you worked on. Did you build a website? Fix a network? Design a database? Explain your role. Insert screenshots of your work here and label them Figure 3.1, Figure 3.2, etc. Delete this red text.]`),
                    
                    formatHeading("3.3 Skills Acquired"),
                    formatText(`During the course of my industrial training, I acquired a diverse range of technical and soft skills. On the technical side, I gained practical proficiency in areas such as system maintenance, networking, and software applications. I also developed strong soft skills, including effective communication, teamwork, problem-solving, and time management, which are essential for thriving in a professional environment.`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("CHAPTER FOUR"),
                    
                    formatHeading("4.1 Problems Encountered During the Period of Attachment"),
                    helperText(`[NOTE: What challenges did you face? (e.g., unstable power supply, lack of internet, difficulty understanding a new programming language, complex company protocols). Delete this red text.]`),
                    
                    formatHeading("4.2 Solutions Implemented"),
                    helperText(`[NOTE: How did you overcome the problems you listed above? (e.g., used offline documentation, asked supervisors for help, brought a power bank). Delete this red text.]`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("CHAPTER FIVE"),
                    
                    formatHeading("5.1 Conclusion"),
                    formatText(`My industrial work experience at ${company} was highly rewarding and educational. It provided a vital bridge between the theoretical concepts taught in the university and the practical realities of the Information Technology industry. I was able to apply my academic knowledge to real-world scenarios, which significantly deepened my understanding of computer science. The training not only improved my technical competencies but also instilled in me a sense of professional responsibility, discipline, and teamwork. I am confident that the skills and experiences gained during this period will be invaluable as I complete my degree and embark on my professional career.`),
                    
                    formatHeading("5.2 Recommendations"),
                    helperText(`[NOTE: What should ${company} improve on? Would you recommend them to future interns? What should the University improve? Delete this red text.]`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("REFERENCES"),
                    helperText(`[NOTE: Delete this red text. List any books, websites, or materials you used here. Follow APA format if possible.]`),

                    new Paragraph({ pageBreakBefore: true }),
                    formatHeading("APPENDIX"),
                    helperText(`[NOTE: Delete this red text. Insert any extra materials here, like your weekly logbook photocopy, sample codes, or questionnaires.]`),
                ]
            }]
        });

        // Generate the file
        Packer.toBlob(doc).then(blob => {
            const fileName = name.replace(/\s+/g, '_') + "_SIWES_Report.docx";
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 1000);

            status.innerText = "Success! Check your phone's Downloads folder.";
            status.style.color = "green";
        }).catch(err => {
            console.error(err);
            status.innerText = "Error generating file. Please try again.";
            status.style.color = "red";
        });
    }
</script>

</body>
</html>
